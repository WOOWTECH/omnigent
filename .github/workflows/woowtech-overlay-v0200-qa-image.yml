name: WOOWTECH overlay images

# PRs verify both overlays without publishing. Release branches and main publish
# unique candidates; promotion and deployment use the recorded digest separately.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/woowtech-overlay-v0200-qa-image.yml
      - deploy/docker/Dockerfile.woowtech-overlay-*
      - deploy/docker/woowtech-*
      - omnigent/**
      - web/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main
      - release/woowtech-overlay/**
    paths:
      - .github/workflows/woowtech-overlay-v0200-qa-image.yml
      - deploy/docker/Dockerfile.woowtech-overlay-*
      - deploy/docker/woowtech-*
      - omnigent/**
      - web/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: woowtech-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WOOWTECH/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            image: ghcr.io/woowtech/omnigent-server-kubernetes
          - component: host
            image: ghcr.io/woowtech/omnigent-host
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Derive unique candidate tag
        id: candidate
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "tag=${IMAGE}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build overlay
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/docker/Dockerfile.woowtech-overlay-${{ matrix.component }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/WOOWTECH/omnigent
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image reference
        if: github.event_name != 'pull_request'
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ steps.candidate.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Missing image digest'
          receipt = {
              'component': os.environ['COMPONENT'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'tag': os.environ['IMAGE_TAG'],
              'image': os.environ['IMAGE'] + '@' + digest,
          }
          Path('overlay-image.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PY
      - name: Upload image receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: overlay-image.json
          if-no-files-found: error
          retention-days: 30
