name: WOOWTECH v0.17 MCP error flag QA server image

on:
  push:
    branches:
      - fix/omnigent-v017-mcp-iserror-20261014

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    if: github.repository == 'WOOWTECH/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/docker/Dockerfile.woowtech-mcp-iserror-qa
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/woowtech/omnigent-server-kubernetes:0.17.0-mcp-iserror-qa-20261014
          labels: |
            org.opencontainers.image.source=https://github.com/WOOWTECH/omnigent
            org.opencontainers.image.revision=${{ github.sha }}
