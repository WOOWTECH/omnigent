name: WOOWTECH native MCP artifacts

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed source commit present on this workflow ref
        required: true
        type: string
      publish:
        description: Publish unique candidate images after runtime verification
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      publish:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  wheel:
    if: github.repository == 'WOOWTECH/omnigent'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      wheel_sha256: ${{ steps.receipt.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Validate immutable source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - uses: ./.github/actions/setup-uv
        with:
          version: 0.13.4
      - name: Build portable wheel and content receipt
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          uv run --no-project --python 3.12.14 python scripts/woowtech_mcp_artifact.py build \
            --source-commit "$SOURCE_COMMIT" --output portable-wheel
      - name: Read wheel receipt
        id: receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('portable-wheel/WOOW_BUILD_RECEIPT.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('wheel_sha256=' + receipt['wheelSha256'] + '\n')
          PY
      - name: Name immutable artifact
        id: name
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: echo "artifact=woow-mcp-wheel-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: portable-wheel/
          if-no-files-found: error
          retention-days: 30

  images:
    needs: wheel
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [server, server-kubernetes]
        include:
          - variant: server
            base: ghcr.io/omnigent-ai/omnigent-server:v0.23.0@sha256:9532f3f73c176342c748f8a1fd3632e73480cb4cc7a64446be6a835e252f2081
          - variant: server-kubernetes
            base: ghcr.io/omnigent-ai/omnigent-server-kubernetes:v0.23.0@sha256:3ae833b9d9bd57fa29bf9c759c94b1bfe73d342b6b16792f65a7e014323bb10d
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.wheel.outputs.artifact }}
          path: portable-wheel
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Candidate reference
        id: candidate
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/woowtech_mcp_image_receipt.py tag >> "$GITHUB_OUTPUT"
      - name: Build candidate locally
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/docker/Dockerfile.woowtech-overlay-server
          build-contexts: mcp-artifact=./portable-wheel
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.candidate.outputs.tag }}
          labels: io.woowtech.omnigent.variant=${{ matrix.variant }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            IMAGE_VARIANT=${{ matrix.variant }}
            SOURCE_COMMIT=${{ inputs.source_commit }}
            WHEEL_SHA256=${{ needs.wheel.outputs.wheel_sha256 }}
      - name: Verify candidate runtime and OCI identity
        env:
          IMAGE_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VARIANT: ${{ matrix.variant }}
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_TAG")" = "$SOURCE_COMMIT"
          test "$(docker inspect --format '{{ index .Config.Labels "io.woowtech.omnigent.variant" }}' "$IMAGE_TAG")" = "$VARIANT"
          test "$(docker inspect --format '{{ index .Config.Labels "io.woowtech.omnigent.base-image" }}' "$IMAGE_TAG")" = "$BASE_IMAGE"
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE_TAG" \
            /opt/woow-artifact/verify.py runtime --artifact /opt/woow-artifact \
            --source-commit "$SOURCE_COMMIT" --debian-security --image-variant "$VARIANT"
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture and record registry digest
        if: inputs.publish
        env:
          IMAGE_TAG: ${{ steps.candidate.outputs.tag }}
          BASE_IMAGE: ${{ matrix.base }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest}}' > registry-manifest.json
          python3 scripts/woowtech_mcp_image_receipt.py architecture \
            --artifact portable-wheel --manifest registry-manifest.json --output image-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.publish
        with:
          name: woow-mcp-image-${{ matrix.variant }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-receipt.json
          if-no-files-found: error
          retention-days: 30

  manifests:
    if: inputs.publish
    needs: [wheel, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [server, server-kubernetes]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: woow-mcp-image-${{ matrix.variant }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-receipts/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: woow-mcp-image-${{ matrix.variant }}-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-receipts/arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest from verified immutable architecture references
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/woowtech_mcp_image_receipt.py manifest --receipts image-receipts --output candidate-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: woow-mcp-candidate-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-image.json
          if-no-files-found: error
          retention-days: 30
